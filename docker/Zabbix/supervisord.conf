[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql
stopwaitsecs=30
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/mariadb.log

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
priority=20
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/apache2.log

[program:zabbix-server]
command=/bin/bash -c 'until mysqladmin ping --silent 2>/dev/null; do sleep 1; done; exec /usr/sbin/zabbix_server -f -c /etc/zabbix/zabbix_server.conf'
stopwaitsecs=30
priority=30
startsecs=10
startretries=30
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/zabbix-server.log

[program:zabbix-agent2]
command=/usr/sbin/zabbix_agent2 -f -c /etc/zabbix/zabbix_agent2.conf
user=zabbix
priority=40
startretries=10
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/zabbix-agent2.log

[program:gui]
command=/usr/local/bin/gui.sh
environment=HOME="/root"
priority=50
startsecs=0
autorestart=unexpected
exitcodes=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/gui.log
